<body>
    

    <script>


// Map -  Used to iterate array object
    // it return new array
    // and its chainable , we can use other array methods inside map like filter ,find, sort

    // syntax -
        const data =[
            {
                id:1,
                name:"Prathmesh",
                address:"Pune"
            },
            {
                id:2,
                name:"Pratik",
                address:"Pune"
            },
            {
                id:3,
                name:"ABC",
                address:"Pune"
            }
        ]

        // 1 argument must ,other are optional
        data.map((val)=>{
            console.log(val)
        })
    </script>
</body>
