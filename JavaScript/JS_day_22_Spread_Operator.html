<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    


    <script>
        // Spread Operator
        // Modern JS feature
        // spread the values from array and object
        // indicate by ...
        // used for merge 2 or more array , extract array / object values , coping array


        const age=[10,20,30,40,50]
        const skill=["React JS","HTML","Next JS","AI"]

        const newArray=[...age,...skill]        // merge two array
        console.log(newArray)


        const number=[11,22,33,44,55]
        const alphabet=['a','b','c']

        const aphaNumeric=[...number,...alphabet]   // merge two array
        console.log(aphaNumeric)




    </script>



</body>
</html>
