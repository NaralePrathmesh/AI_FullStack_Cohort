<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <main>
        <section>
            <center>

                <div style="width:80%;background-color:aqua;text-align:left;">
                    <h1 style="color: blueviolet;text-align:center">STUDENT REGISTRATION FORM</h1>
                    <hr>
                    <label style="font-weight:bold;margin-left:20px" for="">FIRST NAME</label>
                    <input style="margin-left:60px" type="name" name="firstname" id=""><span> (max 30 character a-z and
                        A-Z)</span><br><br>

                    <label style="margin-left:20px;font-weight:bold;" for="">LAST NAME</label>
                    <input style="margin-left:65px" type="name" name="lastname" id=""><span> (max 30 character a-z and
                        A-Z)</span><br><br>

                    <label style="margin-left:20px;font-weight:bold;" for="">DATE OF BIRTH</label>
                    <input style="margin-left:40px" type="date" name="birthdate" id=""><br><br>

                    <label style="font-weight:bold;margin-left:20px" for="">EMAIL ID</label>
                    <input style="margin-left:83px" type="email" name="useremail" id=""><br><br>

                    <label style="font-weight:bold;margin-left:20px" for="">MOBILE NUMBER</label>
                    <input style="margin-left:20px" type="number" name="usernumber" id=""><span>(10 digit
                        number)</span><br><br>

                    <label style="font-weight:bold;margin-left:20px" for="">GENDER</label>
                    <input style="margin-left:87px" type="radio" name="usergender" id="gender"
                        value="Male"><span>Male</span>
                    <input style="margin-left:87px" type="radio" name="usergender" id="gender"
                        value="Female"><span>Female</span><br><br>

                    <label style="font-weight:bold;margin-left:20px" for="">ADDRESS</label>
                    <textarea style="margin-left:80px" name="" id=""></textarea><br><br>

                    <label style="font-weight:bold;margin-left:20px" for="">CITY</label>
                    <select style="margin-left:115px" name="" id="">
                        <option value="None">SELECT</option>
                        <option value="NAGAR">NAGAR</option>
                        <option value="PUNE">PUNE</option>
                        <option value="MUMBAI">MUMBAI</option>
                    </select> <br><br>

                    <label style="font-weight:bold;margin-left:20px" for="">PIN CODE</label>
                    <input style="margin-left:80px" type="number" name="" id=""><br><br>

                    <label style="font-weight:bold;margin-left:20px" for="">STATE</label>
                    <select style="margin-left:110px" name="" id="">
                        <option value="None">SELECT</option>
                        <option value="MAHARASHTRA">MAHARASHTRA</option>
                        <option value="GUJRAT">GUJRAT</option>
                        <option value="UP">UP</option>
                    </select> <br><br>

                    <label style="font-weight:bold;margin-left:20px" for="">COUNTRY</label>
                    <select style="margin-left:80px" name="" id="">
                        <option value="None">SELECT</option>
                        <option value="INDIA">INDIA</option>
                        <option value="AMERICA">AMERICA</option>
                        <option value="UAE">UAE</option>
                    </select> <br><br>

                    <label style="margin-left:20px" for="">HOBBIES</label>
                    <input style="margin-left:90px" type="checkbox" name="hobby" id=""><span>Drawing</span>
                    <input style="margin-left:90px" type="checkbox" name="hobby" id=""><span>Dancing</span>
                    <input style="margin-left:90px" type="checkbox" name="hobby" id=""><span>Sketching</span>
                    <input style="margin-left:90px" type="checkbox" name="hobby" id=""><span>Others <textarea name=""
                            id=""></textarea></span> <br><br>


                    <table style="border: 2px;">
                        <tr>
                            <th>QUALIFICATION</th>
                            <th>Sr.No </th>
                            <th>Examination</th>
                            <th>Board</th>
                            <th>Percentage</th>
                            <th>Year of Passing</th>
                        </tr>

                        <tr>
                            <td><label for=""></label></td>
                            <td><label for="">1</label></td>
                            <td><label for="">Class X</label></td>
                            <td><input type="text" name="" id=""></td>
                            <td><input type="text" name="" id=""></td>
                            <td><input type="text" name="" id=""></td>
                        </tr><br>
                        <tr>
                            <td><label for=""></label></td>
                            <td><label for="">2</label></td>
                            <td><label for="">Class XII</label></td>
                            <td><input type="text" name="" id=""></td>
                            <td><input type="text" name="" id=""></td>
                            <td><input type="text" name="" id=""></td>
                        </tr><br>
                        <tr>
                            <td><label for=""></label></td>
                            <td><label for="">3</label></td>
                            <td><label for="">Graduation</label></td>
                            <td><input type="text" name="" id=""></td>
                            <td><input type="text" name="" id=""></td>
                            <td><input type="text" name="" id=""></td>
                        </tr><br>

                        <tr>
                            <td><label for=""></label></td>
                            <td><label for="">4</label></td>
                            <td><label for="">Masters</label></td>
                            <td><input type="text" name="" id=""></td>
                            <td><input type="text" name="" id=""></td>
                            <td><input type="text" name="" id=""></td>
                        </tr><br>

                    </table> <br>

                    <label style="font-weight:bold;margin-left:20px" for="">COURSES <br> APPLIED FOR</label>
                    <input style="margin-left:70px" type="radio" name="" id=""><span>BCA</span>
                    <input style="margin-left:70px" type="radio" name="" id=""><span>BCOM</span>
                    <input style="margin-left:70px" type="radio" name="" id=""><span>BSC</span>
                    <input style="margin-left:70px" type="radio" name="" id=""><span>BA</span>

                    <br><br>


                    <center><button style="font-weight:bold;">SUBMIT</button> <input style="font-weight:bold;"
                            type="RESET" name="" id=""></center>

                </div>
            </center>
        </section>
    </main>
</body>

</html>
