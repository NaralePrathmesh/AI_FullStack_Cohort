<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        .background_img{
            height: 729px;
            width: 100%;
            background: url(../assets/tanishq1.webp) no-repeat center/cover;
            background-color: rgba(255, 255, 255, 0.7);
            background-attachment:fixed ;
            float: left;
        }

        .image{
            height: 400px;
            width: 600px;
            margin-left: 500px;
            margin-top: 150px;
            float: left;
            background: url(../assets/tanish2.webp) no-repeat center/cover;
            border-radius: 10px;
        }
        .image1{
            margin-top: 150px;
            height: 100%;
            width: 100%;
        }

        .image button{
            height: 50px;
            width: 250px;
            border: 10px;
            margin-top: 250px;
            margin-left: 180px;
            border-radius: 10px;
            background-color: white;
        }

        .image h1{
            color: white;
            text-align: center;
            margin-top: 20px;
        }

        .blur_img{
            height: 729px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.8);
        }

        .image h1{
            font-size: 50px;
        }
    </style>
</head>
<body>
    <main>
        <div class="background_img">
            <div class="blur_img">
                <div class="image">
                    <h1>Welcome to Tanishq</h1>
                    <button>Find My Discount</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
