<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <!-- Internal CSS -->
    <style>
        * {
            margin: 0;
        }

        .main_container {
            height: 730px;
            width: 100%;
            background-color: #FEFDF8;
        }

        .container_1 {
            height: 90px;
            width: 100%;
        }

        .navbar {
            float: left;

        #navbar1 {

        #navbar2 {
            width: 60%;

        #navbar3 {
            width: 25%;

        #logo {

        }

        .navbar_lists {
            display: inline-block;
            color: black;
            font-size: medium;
            margin-left: 110px;
            margin-top: 30px;
            font-size: 20px;
        }

        #btn1 {

            width: 150px;
            background-color: #0981F9;
            color: white;
            font-size: 20px;
            border-radius: 2px;

            margin-left: 90px;

        .container_2 {
            height: 400px;
            width: 100%;
            float: left;
            margin-top: 150px;
        }

        .container_2_1 {
            height: 100%;
            width: 40%;
            margin-left: 7%;

        }

        #btn2 {

            width: 500px;
            margin-top: 10px;
            margin-left: 50px;

            font-size: 16px;
        }

        #heading_1 {
            margin-top: 10px;
            text-align: center;
            font-size: 55px;
            font-weight: bold;
        }

        .heading_2 {
            margin-left: 68px;
            margin-top: 11px;
        }

        #heading_2_1 {
            color: #1661ac;
        }

        #para {
            margin-left: 68px;
            margin-top: 15px;
            color: black;
        }

        .social_media {

            margin-left: 15px;
            height: 40px;
            margin-top: 20px;

        #btn3 {
            margin-top: 30px;

            margin-right: 20px;

            background-color: #E8F1FA;

        #btn4 {

            height: 40px;
            width: 140px;
            background-color: #E8F1FA;
            border-radius: 10px;
            border: 2px solid rgb(255, 55, 88);
            color: rgb(255, 55, 88);
        }

</head>

                <div class="navbar" id="navbar1">

                        <li class="navbar_lists"><a href="">Industries</a></li>

                        <li class="navbar_lists"><a href="">Resources</a></li>

        <!-- section 1 -->
        <section class="container_2">

            <div class="container_2_1">

                <button id="btn3">CALL NOW</button>
                <button id="btn4">ENQUIRE NOW</button>

                <iframe id="video" width="560" height="315"
                    src="https://www.youtube.com/embed/kbBT8jpg8xE?si=2t8PJSyrXUGGELqk" title="YouTube video player"

                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

</html>
