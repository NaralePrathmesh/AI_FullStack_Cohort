<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <!-- Create a function calculateOrder().
    Take from the user:
    Customer name
    Product price
    Quantity

    Calculate:
    Total = price × quantity

    Then apply discount:
    Total >= 5000 → 20% discount
    Total >= 3000 → 10% discount
    Total >= 1000 → 5% discount
    Below 1000 → No discount -->


    <script>
        let cust_name = prompt("Enter customer name");
        let prod_price = Number(prompt("Enter Product Price"));
        let quantity = Number(prompt("Enter quantity of product"));

        let Total = prod_price * quantity;
        let discount = 0;

        const calculateOrder = (cust_name,prod_price,quantity) => {
            if (Total >= 5000) {
                discount = Total * 20 / 100;
            }

            else if (Total >= 3000) {
                discount = Total * 10 / 100;
            }

            else if (Total >= 1000) {
                discount = Total * 5 / 100;
            }

            else (Total < 1000) {
                document.write("No Discount");
            }

            document.write(Total);
            document.write(discount);

            let Final_price=Total-discount;
            document.write(`${cust_name} Your price after discount is: ${Final_price}`);
        }
        calculateOrder(cust_name,prod_price,quantity);


    </script>





</body>

</html>
