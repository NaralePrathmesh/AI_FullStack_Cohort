<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container{
            height: 100vh;
            width: 100vw;
            background-color: aqua;

        }

        .box1{
            height: 300px;
            width: 300px;
            background-color: black;
            float: left;
            display: block;
        }

        .box2{
            height: 300px;
            width: 300px;
            float: left;
            background-color: rgb(244, 7, 7);
            visibility: visible;
        }

        .box3{
            height: 300px;
            width: 300px;
            float: left;
            background-color: rgb(15, 180, 230);
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
    </div>
</body>
</html>
