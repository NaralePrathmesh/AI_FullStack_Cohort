    <!-- "Papaya", "Pineapple", "Guava", "Strawberry" -->

    <script>
        const arr=["Apple", "Banana", "Mango", "Orange", "Grapes", "Watermelon"];
        console.log(arr);

        arr.push("papaya");

        console.log(arr);




    </script>
