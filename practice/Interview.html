    <script>
        // Ternary operator

        let marks=Number(prompt("Enter Your marks"));
        let result=marks>=35 ? "Pass" : "Fail";
        alert(result);


        // Nullish operator

        let Masters ="MCA";
        let Bachelors="BCA";
        console.log(Masters ?? Bachelors);
    </script>
